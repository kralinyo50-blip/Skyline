<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0c1019" />
    <title>Skyline — Çevrimdışı</title>
    <style>
      body {
        background: #090c13;
        color: #ecf1fa;
        font: 16px/1.7 system-ui;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      main {
        max-width: 440px;
        padding: 32px;
      }
      h1 {
        color: #ffbb55;
        font-size: 32px;
      }
      a {
        display: inline-block;
        color: #131820;
        background: #ffbb55;
        padding: 12px 20px;
        border-radius: 9px;
        text-decoration: none;
      }
      p {
        color: #a6b2c6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bağlantıya küçük bir ara.</h1>
      <p>
        Skyline’a ulaşmak için internet bağlantını kontrol et. Çevrimdışı ödeme,
        teklif veya görsel üretimi yapılmaz. Yerel kayıtların silinmedi.
      </p>
      <a href="./">Tekrar dene</a>
    </main>
  </body>
</html>
